  { key: "budget", label: "Budget", count: () => store.budget.length, clear: () => { store.budget = []; } },
  { key: "candidates", label: "Vendor options", count: () => store.candidates.length, clear: () => { store.candidates = []; } },
  { key: "vendors", label: "Vendors", count: () => store.vendors.length, clear: () => { store.vendors = []; } },
  { key: "guests", label: "Guests", count: () => store.guests.length, clear: () => { store.guests = []; } },
  { key: "tables", label: "Seating tables", count: () => store.tables.length, clear: () => { store.tables = []; store.guests.forEach(g => { g.tableId = ""; }); } },
  { key: "dayPlan", label: "Day-of schedule", count: () => store.dayPlan.length, clear: () => { store.dayPlan = []; } },

let pendingClear = null;

function openClearSectionModal() {
  const rows = CLEARABLE.map(sec => {
    const n = sec.count();
    return `<div class="clear-row">
      <div><div class="cr-name">${sec.label}</div><div class="cr-count">${n} item${n === 1 ? "" : "s"}</div></div>
      <button class="btn btn-sm ${n ? "btn-danger" : ""}" data-action="clear-section" data-key="${sec.key}" ${n ? "" : 'disabled style="opacity:.4"'}>Clear</button>
    </div>`;
  }).join("");
  openModal(modalShell(
    "Clear a section",
    "Start a single section over while keeping everything else. Each clear asks you to confirm.",
    `<div class="clear-list">${rows}</div>`,
    `<button class="btn btn-ghost" data-action="close-modal">Done</button>`,
    true
  ));
}

function confirmClear(label, n, onYes) {
  pendingClear = onYes;
  openModal(modalShell(
    "Clear " + label + "?",
    "This permanently deletes " + n + " item" + (n === 1 ? "" : "s") + " in this section. Everything else stays.",
    `<div class="alloc-warn" style="margin-bottom:0"><span class="aw-ic">${ICONS.alert}</span><span class="aw-text">This can't be undone. Download a backup first if unsure.</span></div>`,
    `<button class="btn btn-ghost" data-action="back-to-clear">Cancel</button>
     <button class="btn btn-danger" data-action="do-clear-section">Clear ${label}</button>`
  ));
}

  ["Blush", "#d4a5a5"], ["Rosewood", "#b06b6b"], ["Terracotta", "#c07a5b"], ["Champagne", "#c2a36b"],

  ["Lavender", "#a99bc0"], ["Plum", "#9a6f8e"]
];

function openThemeModal() {
  const current = (store.theme || "#d4a5a5").toLowerCase();
  const swatches = THEME_PRESETS.map(([name, hex]) =>
    `<button class="theme-sw ${current === hex.toLowerCase() ? "sel" : ""}" data-action="set-theme" data-color="${hex}">
       <span style="background:${hex}"></span>${name}</button>`
  ).join("");

  openModal(modalShell(
    "Appearance",
    "Pick a color theme and language — the rest of the design stays the same.",
    `<div class="field">
       <label>Language</label>
       <select id="theme-lang"><option value="en" ${uiLang === "en" ? "selected" : ""}>English</option><option value="es" ${uiLang === "es" ? "selected" : ""}>Español</option></select>
     </div>
     <div class="field">
       <label>Color theme</label>
       <div class="theme-grid">${swatches}</div>
     </div>
     <div class="field" style="margin-bottom:4px">
       <label>Custom accent color</label>
       <input type="color" id="theme-custom" value="${current}">
       <div class="hint-text">Choose any color — buttons, highlights and accents update instantly.</div>
     </div>`,
    `<button class="btn btn-ghost" data-action="reset-theme">Reset to blush</button>
     <button class="btn btn-primary" data-action="close-modal">Done</button>`
  ));

  const ci = document.getElementById("theme-custom");
  if (ci) ci.addEventListener("input", () => { store.theme = ci.value; applyTheme(ci.value); saveStore(); });
  const ls = document.getElementById("theme-lang");
  if (ls) ls.addEventListener("change", () => {
    uiLang = ls.value;
    if (store.setup) store.setup.language = ls.value;
    saveStore();
    render();
    openThemeModal();
  });
}

/* =========================================================
   Event delegation
   ========================================================= */
document.addEventListener("click", (e) => {
  const navEl = e.target.closest("[data-nav]");
  if (navEl) { go(navEl.dataset.nav); return; }

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case "close-modal": closeModal(); break;

    case "add-task": openTaskModal(); break;
    case "edit-task": openTaskModal(id); break;
    case "toggle-task": {
      const t = store.tasks.find(x => x.id === id);
      if (t) { t.completed = !t.completed; saveStore(); render(); }
      break;
    }
    case "delete-task": confirmDelete("task", () => { store.tasks = store.tasks.filter(x => x.id !== id); }); break;

    case "add-budget": openBudgetModal(); break;
    case "edit-budget-total": openBudgetSettingsModal(); break;
    case "edit-budget": openBudgetModal(id); break;
    case "delete-budget": confirmDelete("category", () => { store.budget = store.budget.filter(x => x.id !== id); }); break;

    case "add-vendor": openVendorModal(); break;
    case "edit-vendor": openVendorModal(id); break;
    case "delete-vendor": confirmDelete("vendor", () => { store.vendors = store.vendors.filter(x => x.id !== id); }); break;
    case "cycle-vendor": {
      const v = store.vendors.find(x => x.id === id);
      if (v) {
        const order = ["pending", "confirmed", "paid"];
        v.status = order[(order.indexOf(v.status) + 1) % order.length];
        saveStore(); render();
      }
      break;
    }

    case "add-guest": openGuestModal(); break;
    case "edit-guest": openGuestModal(id); break;
    case "delete-guest": confirmDelete("guest", () => { store.guests = store.guests.filter(x => x.id !== id); }); break;
    case "send-invite": openInviteModal(id); break;
    case "invite-email": {
      const g = store.guests.find(x => x.id === inviteGuestId);
      if (!g) break;
      const msg = (document.getElementById("invite-msg") || {}).value || inviteMessage(g);
      const subject = encodeURIComponent("You're invited — " + (store.setup.partnerName || "Our Wedding"));
      window.location.href = `mailto:${encodeURIComponent(g.email || "")}?subject=${subject}&body=${encodeURIComponent(msg)}`;
      break;
    }
    case "invite-whatsapp": {
      const g = store.guests.find(x => x.id === inviteGuestId);
      if (!g) break;
      const msg = (document.getElementById("invite-msg") || {}).value || inviteMessage(g);
      const phone = (g.phone || "").replace(/[^\d]/g, "");
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
      break;
    }
    case "invite-copy": {
      const ta = document.getElementById("invite-msg");
      if (ta && navigator.clipboard) {
        navigator.clipboard.writeText(ta.value).then(() => { el.textContent = "Copied ✓"; setTimeout(() => { el.textContent = "Copy"; }, 1500); }).catch(() => {});
      }
      break;
    }

    case "add-inspiration": openInspirationModal(); break;
    case "delete-inspiration": confirmDelete("image", () => { store.inspiration = store.inspiration.filter(x => x.id !== id); }); break;

    case "add-candidate": openCandidateModal(); break;
    case "edit-candidate": openCandidateModal(id); break;
    case "delete-candidate": confirmDelete("option", () => { store.candidates = store.candidates.filter(x => x.id !== id); }); break;
    case "choose-candidate": {
      const c = store.candidates.find(x => x.id === id);
      if (c) {
        store.vendors.push({ id: uid("vendor"), name: c.name, category: c.category, phone: "", email: "", website: c.website || "", cost: c.cost || 0, dueDate: "", status: "confirmed", notes: c.notes || "" });
        store.candidates = store.candidates.filter(x => x.id !== id);
        saveStore(); go("vendors");
      }
      break;
    }

    case "add-table": openTableModal(); break;
    case "edit-table": openTableModal(id); break;
    case "delete-table": confirmDelete("table", () => {
      store.tables = store.tables.filter(x => x.id !== id);
      store.guests.forEach(g => { if (g.tableId === id) g.tableId = ""; });
    }); break;
    case "unseat": {
      const g = store.guests.find(x => x.id === id);
      if (g) { g.tableId = ""; saveStore(); render(); }
      break;
    }

    case "add-day": openDayModal(); break;
    case "edit-day": openDayModal(id); break;
    case "delete-day": confirmDelete("moment", () => { store.dayPlan = store.dayPlan.filter(x => x.id !== id); }); break;
    case "seed-day": seedDayPlan(); render(); break;

    case "add-gift": openGiftModal(); break;
    case "edit-gift": openGiftModal(id); break;
    case "delete-gift": confirmDelete("gift", () => { store.gifts = store.gifts.filter(x => x.id !== id); }); break;
    case "toggle-gift": {
      const g = store.gifts.find(x => x.id === id);
      if (g) { g.thankYouSent = !g.thankYouSent; saveStore(); render(); }
      break;
    }

    case "edit-honeymoon": openHoneymoonModal(); break;
    case "add-honeymoon-item": openHoneymoonItemModal(); break;
    case "edit-honeymoon-item": openHoneymoonItemModal(id); break;
    case "delete-honeymoon-item": confirmDelete("expense", () => { store.honeymoon.items = store.honeymoon.items.filter(x => x.id !== id); }); break;

    case "print": window.print(); break;

    case "submit-form": submitForm(); break;

    case "confirm-delete":
      if (pendingDelete) { pendingDelete(); pendingDelete = null; saveStore(); }
      closeModal(); render();
      break;

    case "seed-tasks": seedTasks(); render(); break;
    case "seed-budget": seedBudget(); render(); break;
    case "apply-starters": {
      if (document.getElementById("opt-tasks") && document.getElementById("opt-tasks").checked) seedTasks();
      const ob = document.getElementById("opt-budget");
      if (ob && ob.checked) seedBudget();
      closeModal(); render();
      break;
    }

    case "wizard-next": wizardNext(); break;
    case "wizard-back": captureWizardStep(); wizard.step--; renderWizard(); break;
    case "edit-setup": openSetup(true); break;
    case "export-data": exportData(); break;
    case "open-export": openExportModal(); break;
    case "open-data": openDataModal(); break;
    case "excel-download": {
      const keys = Object.keys(CSV_EXPORTS).filter(k => { const cb = document.getElementById("exp-" + k); return cb && cb.checked; });
      if (!keys.length) { alert("Tick at least one section to include."); break; }
      const sheets = keys.map(k => { const d = CSV_EXPORTS[k](); return { name: d.label, headers: d.headers, rows: d.rows }; });
      downloadFile(`wedding-planner-${new Date().toISOString().slice(0, 10)}.xls`, buildXLS(sheets), "application/vnd.ms-excel");
      break;
    }
    case "export-pdf": closeModal(); go("summary"); setTimeout(() => window.print(), 250); break;

    case "load-demo":
      closeModal();
      openModal(modalShell("Load sample data?", "This replaces your current data with a demo you can explore.", "",
        `<button class="btn btn-ghost" data-action="close-modal">Cancel</button>
         <button class="btn btn-primary" data-action="do-load-demo">Load sample data</button>`));
      break;
    case "do-load-demo":
      loadDemoData();
      uiLang = store.setup.language || uiLang;
      closeModal(); currentView = "dashboard"; render();
      break;
    case "reset-confirm": openResetModal(); break;
    case "do-reset":
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      store = emptyStore();
      uiLang = "en";
      closeModal();
      applyTheme(store.theme);
      currentView = "dashboard";
      render();
      break;
    case "clear-section-open": openClearSectionModal(); break;
    case "clear-section": {
      const sec = CLEARABLE.find(c => c.key === el.dataset.key);
      if (sec && sec.count()) confirmClear(sec.label, sec.count(), sec.clear);
      break;
    }
    case "back-to-clear": openClearSectionModal(); break;
    case "do-clear-section":
      if (pendingClear) { pendingClear(); pendingClear = null; saveStore(); }
      render();
      openClearSectionModal();
      break;

    case "open-theme": openThemeModal(); break;
    case "set-theme": store.theme = el.dataset.color; applyTheme(store.theme); saveStore(); openThemeModal(); break;
    case "reset-theme": store.theme = "#d4a5a5"; applyTheme(store.theme); saveStore(); openThemeModal(); break;

    case "cal-prev": { calCursor.m--; if (calCursor.m < 0) { calCursor.m = 11; calCursor.y--; } render(); break; }
    case "cal-next": { calCursor.m++; if (calCursor.m > 11) { calCursor.m = 0; calCursor.y++; } render(); break; }
    case "cal-today": { const n = new Date(); calCursor = { y: n.getFullYear(), m: n.getMonth() }; render(); break; }
    case "cal-wedding": {
      const wd = parseDate(store.setup.weddingDate);
      if (wd) { calCursor = { y: wd.getFullYear(), m: wd.getMonth() }; render(); }
      break;
    }
    case "cal-day": openDayDetail(el.dataset.date); break;
    case "cal-add": openTaskModal(null, el.dataset.date); break;
  }
});

// Enter saves the open form / advances the setup wizard
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea") return; // let Notes fields make new lines

  const form = document.getElementById("f");
  if (form && form.contains(e.target)) {
    e.preventDefault();
    submitForm();
    return;
  }
  // setup wizard: standalone inputs (ids start with "w-")
  if (document.querySelector("[data-action='wizard-next']") && /^w-/.test(e.target.id || "")) {
    e.preventDefault();
    wizardNext();
    return;
  }
  // confirmation modals (delete, apply starters) — Enter triggers the main action
  const confirmBtn = document.querySelector("[data-action='confirm-delete'], [data-action='apply-starters']");
  if (confirmBtn) {
    e.preventDefault();
    confirmBtn.click();
  }
});

/* =========================================================
   Drag & drop — generic reordering for any collection.
   A draggable item has [data-drag-item][data-id]; it lives in a
   [data-drop-zone][data-reorder="<collection>"]. Grouped collections
   (guests by table, candidates by category) add data-group-field /
   data-group-value so dropping into another zone updates that field.
   ========================================================= */
let dragEl = null;
let dragCollection = null;

function collectionRef(key) {
  switch (key) {
    case "tasks": return store.tasks;
    case "budget": return store.budget;
    case "vendors": return store.vendors;
    case "gifts": return store.gifts;
    case "inspiration": return store.inspiration;
    case "candidates": return store.candidates;
    case "guests": return store.guests;
    case "honeymoon": return store.honeymoon.items;
    default: return null;
  }
}
function setCollection(key, arr) {
  switch (key) {
    case "tasks": store.tasks = arr; break;
    case "budget": store.budget = arr; break;
    case "vendors": store.vendors = arr; break;
    case "gifts": store.gifts = arr; break;
    case "inspiration": store.inspiration = arr; break;
    case "candidates": store.candidates = arr; break;
    case "guests": store.guests = arr; break;
    case "honeymoon": store.honeymoon.items = arr; break;
  }
}

// Reading-order insertion point: works for both single-column lists and grids.
function dragAfter(zone, x, y) {
  const els = Array.prototype.slice.call(zone.querySelectorAll("[data-drag-item]:not(.dragging)"));
  for (let i = 0; i < els.length; i++) {
    const b = els[i].getBoundingClientRect();
    if (y < b.top) return els[i];
    if (y <= b.bottom && x < b.left + b.width / 2) return els[i];
  }
  return null;
}

function persistDragOrder(key) {
  const arr = collectionRef(key);
  if (!arr) return;
  const byId = {};
  arr.forEach(x => { byId[x.id] = x; });
  const zones = document.querySelectorAll('[data-drop-zone][data-reorder="' + key + '"]');
  const ordered = [];
  const seen = {};
  zones.forEach(zone => {
    const field = zone.dataset.groupField;
    const value = zone.dataset.groupValue || "";
    zone.querySelectorAll("[data-drag-item]").forEach(el => {
      const it = byId[el.dataset.id];
      if (it && !seen[it.id]) {
        if (field) it[field] = value;
        ordered.push(it);
        seen[it.id] = true;
      }
    });
  });
  const rest = arr.filter(x => !seen[x.id]);
  setCollection(key, ordered.concat(rest));
  saveStore();
  render();
}

document.addEventListener("dragstart", (e) => {
  const item = e.target.closest("[data-drag-item]");
  if (!item) return;
  const zone = item.closest("[data-drop-zone]");
  if (!zone) return;
  dragEl = item;
  dragCollection = zone.dataset.reorder;
  setTimeout(() => item.classList.add("dragging"), 0);
  if (e.dataTransfer) {
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", "drag"); } catch (_) {}
  }
});

document.addEventListener("dragover", (e) => {
  if (!dragEl) return;
  const zone = e.target.closest('[data-drop-zone][data-reorder="' + dragCollection + '"]');
  if (!zone) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".drag-over").forEach(z => { if (z !== zone) z.classList.remove("drag-over"); });
  zone.classList.add("drag-over");
  const after = dragAfter(zone, e.clientX, e.clientY);
  if (after == null) zone.appendChild(dragEl);
  else zone.insertBefore(dragEl, after);
});

document.addEventListener("drop", (e) => {
  if (dragEl) e.preventDefault();
});

document.addEventListener("dragend", () => {
  if (!dragEl) return;
  dragEl.classList.remove("dragging");
  const key = dragCollection;
  dragEl = null;
  dragCollection = null;
  document.querySelectorAll(".drag-over").forEach(z => z.classList.remove("drag-over"));
  persistDragOrder(key);
});
